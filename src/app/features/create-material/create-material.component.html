<mat-card>
  <mat-card-header>
    <mat-card-title>Add a New Company</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="newCompany" (ngSubmit)="onSubmit()">
      <mat-label>
        <br />
        Basic Info
      </mat-label>
      <mat-grid-list cols="4">
        <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Company's Name" required />
          <mat-error *ngIf="isFieldInvalid('name')">Name is required.</mat-error>
        </mat-form-field>
        <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
          <mat-label>Website</mat-label>
          <input matInput formControlName="website" placeholder="Company's Website URL" />
          <mat-error *ngIf="isFieldInvalid('website')">Enter a valid URL.</mat-error>
        </mat-form-field>

        <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
          <mat-label>VAT</mat-label>
          <input
            matInput
            formControlName="vat"
            placeholder="Company's VAT Number"
            required
          />
          <mat-error *ngIf="isFieldInvalid('vat')">VAT is required.</mat-error>
        </mat-form-field>

        <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
          <mat-label>Phone Number</mat-label>
          <input
            matInput
            formControlName="phoneNumber"
            placeholder="Company's Phone Number"
          />
        </mat-form-field>
      </mat-grid-list>

      <mat-divider />

      <fieldset formGroupName="address">
        <legend>Address</legend>
        <div class="mat-grid">
          <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
            <mat-label>Country</mat-label>
            <input matInput formControlName="country" placeholder="Company's Country" />
          </mat-form-field>

          <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
            <mat-label>City</mat-label>
            <input matInput formControlName="city" placeholder="Company's City" />
          </mat-form-field>
        </div>

        <div class="mat-grid">
          <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
            <mat-label>Street</mat-label>
            <input
              matInput
              formControlName="street"
              placeholder="Company's Street Name"
            />
          </mat-form-field>

          <mat-form-field class="mat-grid-item" style="margin-right: 1vw">
            <mat-label>Street Number</mat-label>
            <input
              matInput
              formControlName="streetNumber"
              placeholder="Company's Street Number"
            />
          </mat-form-field>
        </div>

        <mat-form-field class="full-width" style="margin-right: 1vw">
          <mat-label>Postal Code</mat-label>
          <input
            matInput
            formControlName="postalCode"
            placeholder="Company's Postal Code"
          />
        </mat-form-field>
      </fieldset>

      <mat-divider />

      <div class="mat-grid" style="margin-top: 1vw; margin-bottom: 1vw">
        <mat-label>Is the job ad sponsored?</mat-label>
        <mat-radio-group formControlName="isSponsored">
          <mat-radio-button value="true">Yes</mat-radio-button>
          <mat-radio-button value="false">No</mat-radio-button>
        </mat-radio-group>
        <mat-error *ngIf="isFieldInvalid('isSponsored')">
          You must pick a choice.
        </mat-error>
      </div>

      <mat-divider />

      <div class="mat-grid" style="margin-top: 1vw; margin-bottom: 1vw">
        <mat-label>
          Company Logo:
          <br />
        </mat-label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          accept="image/jpeg, image/png"
          style="margin-top: 1vw"
        />
      </div>

      <mat-divider />

      <mat-card-actions align="end">
        <button
          mat-raised-button
          color="accent"
          type="submit"
          [disabled]="newCompany.invalid"
        >
          Submit
        </button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
