<nav class="aa:ml-[5vw] aa:flex aa:w-max aa:items-center aa:self-start">
  <ul id="menu"
      class="aa:justify-left aa:flex aa:grow aa:flex-col aa:gap-5 aa:text-gray-500 md:aa:flex md:aa:flex-row"
      [ngClass]="navClass">
    <ng-container *ngFor="let item of MenuItems; let i = index">
      <div *ngIf="item.active; then content; else other"></div>
      <ng-template #content>
        <li (mouseenter)="toggleSubmenu(i)">
          <button class="active [&.active]:aa:border-b-2 [&.active]:aa:border-blue-700 [&.active]:aa:font-semibold [&.active]:aa:text-blue-700 aa:h-full hover:aa:text-orange-500 aa:w-auto aa:px-2 aa:py-3"
                  (click)="onClick(i)">
            {{ item.title }}
          </button>
          <div (mouseleave)="closeSubmenu(i)">
            <ul *ngIf="item.submenu && item.showSubmenu"
                class="aa:absolute aa:z-10 aa:mt-2 aa:w-48 aa:bg-white aa:border aa:rounded aa:shadow-md">
              <li *ngFor="let subItem of item.submenu; let subIndex = index">
                <button class="aa:block hover:aa:text-orange-500 aa:w-full aa:text-left aa:px-4 aa:py-2 hover:aa:bg-gray-200 [&.active]:aa:border-b-2 [&.active]:aa:border-blue-700 [&.active]:aa:font-semibold [&.active]:aa:text-blue-700"
                        (click)="onClick(i, subIndex)">
                  {{ subItem.title }}
                </button>
              </li>
            </ul>
          </div>
        </li>
      </ng-template>
      <ng-template #other>
        <li (mouseenter)="toggleSubmenu(i)">
          <button class="aa:h-full hover:aa:text-orange-500 aa:w-auto aa:px-2 aa:py-3"
                  (click)="onClick(i)">
            {{ item.title }}
          </button>
          <div (mouseleave)="closeSubmenu(i)">
            <ul *ngIf="item.submenu && item.showSubmenu"
                class="aa:absolute aa:z-10 aa:mt-2 aa:w-48 aa:bg-white aa:border aa:rounded aa:shadow-md">
              <li *ngFor="let subItem of item.submenu; let subIndex = index">
                <button class="aa:block hover:aa:text-orange-500 aa:w-full aa:text-left aa:px-4 aa:py-2 hover:aa:bg-gray-200 [&.active]:aa:border-b-2 [&.active]:aa:border-blue-700 [&.active]:aa:font-semibold [&.active]:aa:text-blue-700"
                        (click)="onClick(i, subIndex)">
                  {{ subItem.title }}
                </button>
              </li>
            </ul>
          </div>
        </li>
      </ng-template>
    </ng-container>
  </ul>
</nav>
<button class="aagrow aa:text-md aa:my-2 aa:ml-[90vw] aa:mr-[5vw] aa:flex aa:h-auto aa:min-h-[3vw] aa:w-auto aa:min-w-[3vw] aa:py-2 aa:align-top aa:md:hidden"
        (click)="toggleMenu()"
        aria-label="Toggle Menu">
  <fa-icon [icon]="isMenuOpen ? faArrowUp : faBars"
           class="aa:color-black aa:h-full aa:w-full aa:cursor-pointer aa:hover:text-orange-500" />
</button>
